name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # The grammar comes from GitHub (package.json), built by npm install.
      - uses: actions/checkout@v4
        with:
          path: swiftgraph

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: swiftgraph
        run: npm install

      - name: Format
        working-directory: swiftgraph
        run: npm run format:check

      - name: Type-check
        working-directory: swiftgraph
        run: npx tsc -p .

      - name: Tests
        working-directory: swiftgraph
        run: npm test
