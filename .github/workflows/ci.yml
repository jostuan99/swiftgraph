name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # swiftgraph depends on the grammar as a sibling checkout (file:../tree-sitter-swift).
      - uses: actions/checkout@v4
        with:
          path: swiftgraph

      - uses: actions/checkout@v4
        with:
          repository: JosSteve/tree-sitter-swift
          path: tree-sitter-swift

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the grammar
        working-directory: tree-sitter-swift
        run: npm ci

      - name: Install dependencies
        working-directory: swiftgraph
        run: npm ci

      - name: Format
        working-directory: swiftgraph
        run: npm run format:check

      - name: Type-check
        working-directory: swiftgraph
        run: npx tsc -p .

      - name: Tests
        working-directory: swiftgraph
        run: npm test
